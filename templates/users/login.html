{% extends "homepage.html" %}

{% block title %} Login {% endblock title %}

{% block content %}

<div class="flex flex-col items-center h-80 p-6 rounded-4xl border border-neutral-300 bg-neutral-200">
    
    <div class="font-outfit text-5xl font-semibold text-brand-900">Login</div>
    <br>
    <br>
    <form method="post" class="flex flex-col gap-6 items-center justify-center">
        {% csrf_token %}

        <div class="flex gap-4">
            <label for="{{ form.username.id_for_label }}" class="text-neutral-900">Username: </label>            
            <div class="rounded-md border border-neutral-300 text-neutral-900 bg-neutral-100">
                {{ form.username }}
            </div>
            
        </div>
        
        <div class="flex gap-4">
            <label for="{{ form.password.id_for_label }}" class="text-neutral-900">Password: </label>
            <div class="rounded-md border border-neutral-300 text-neutral-900 bg-neutral-100">
                {{ form.password }}
            </div>
        </div>

        <button type="submit" class="text-xl w-1/2 h-10 rounded-lg my-3 bg-supporting-900 text-brand-400 font-semibold hover:bg-supporting-700">
            Login
        </button>

    </form>

</div>

{% endblock content %}
