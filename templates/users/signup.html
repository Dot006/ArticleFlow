{% extends "homepage.html" %}

{% block title %} Sign Up {% endblock title %}

{% block content %}

<div class="flex flex-col items-center p-6 rounded-4xl border border-neutral-300 bg-neutral-200">
    
    <div class="font-outfit text-5xl font-semibold text-brand-900">Sign Up</div>
    <br>
    <br>
    <form method="post" class="flex flex-col gap-6 items-center justify-center">
        {% csrf_token %}

        <div class="grid grid-cols-2">
            <label for="{{ form.username.id_for_label }}" class="text-neutral-900">Username: </label>
            <div class="rounded-md border border-neutral-300 text-neutral-900 bg-neutral-100">
                {{ form.username }}
            </div>
        </div>

        <div class="grid grid-cols-2">
            <label for="{{ form.name.id_for_label }}" class="text-neutral-900">Name: </label>
            <div class="rounded-md border border-neutral-300 text-neutral-900 bg-neutral-100">
                {{ form.name }}
            </div>
        </div>

        <div class="grid grid-cols-2">
            <label for="{{ form.email.id_for_label }}" class="text-neutral-900">Email: </label>
            <div class="rounded-md border border-neutral-300 text-neutral-900 bg-neutral-100">
                {{ form.email }}
            </div>
        </div>
        
        <div class="grid grid-cols-2">
            <label for="{{ form.password1.id_for_label }}" class="text-neutral-900">Password: </label>
            <div class="rounded-md border border-neutral-300 text-neutral-900 bg-neutral-100">
                {{ form.password1 }}
            </div>
        </div>
        
        <div class="grid grid-cols-2">
            <label for="{{ form.password2.id_for_label }}" class="text-neutral-900">Confirm Password: </label>
            <div class="rounded-md border border-neutral-300 text-neutral-900 bg-neutral-100">
                {{ form.password2 }}
            </div>
        </div>

        <button type="submit" class="text-xl w-1/2 h-10 rounded-lg my-3 bg-supporting-900 text-brand-400 font-semibold hover:bg-supporting-700">
            Sign Up
        </button>
    </form>
</div>

{% endblock content %}
